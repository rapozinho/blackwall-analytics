# Serve o SPA e encaminha /api para a API. O navegador so' fala com esta origem,
# entao CORS deixa de existir no caminho normal.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nao anuncie a versao do nginx em erro/header.
    server_tokens off;

    # Cabecalhos de defesa. CSP restrita: a aplicacao nao carrega script externo,
    # e o unico host externo e' o Google Fonts (usado so' na tela das bases).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Hash no nome do arquivo: pode cachear para sempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        # `backend` e' o nome do servico no compose; num orquestrador, troque
        # pelo DNS interno do servico.
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Consulta pesada passa de 2 minutos. O padrao (60s) cortaria a conexao
        # no meio e a tela mostraria erro de rede numa query que ainda esta viva.
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering       off;
    }

    # SPA: rota do React (ex.: /Zephyr/overview) nao existe em disco e precisa cair
    # no index.html em vez de 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
